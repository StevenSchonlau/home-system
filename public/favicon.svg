<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Progressive Pulse logo (same as the header): a house with a pulse line through it.
       Tile uses the app's accent color, the brighter dark-mode accent when the browser is in dark mode. -->
  <style>
    .tile { fill: #0e7490; }
    @media (prefers-color-scheme: dark) { .tile { fill: #22a6c3; } }
  </style>
  <rect class="tile" width="32" height="32" rx="8" />
  <path d="M7 15.5 16 8l9 7.5V25H7z" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="1.8"
    stroke-linecap="round" stroke-linejoin="round" />
  <path d="M5 19h6l2-4 3 7 2.5-5 1.5 2h7" fill="none" stroke="#fff" stroke-width="2.4"
    stroke-linecap="round" stroke-linejoin="round" />
</svg>
