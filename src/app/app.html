<header>
  <a class="brand" routerLink="/overview">
    <!-- Logo: a house with a pulse line through it -->
    <svg class="brand-logo" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="8" class="logo-tile" />
      <path d="M7 15.5 16 8l9 7.5V25H7z" class="logo-house" />
      <path d="M5 19h6l2-4 3 7 2.5-5 1.5 2h7" class="logo-pulse" />
    </svg>
    <span>Progressive Pulse</span>
  </a>
  <nav aria-label="Main">
    <a routerLink="/overview" routerLinkActive="active" ariaCurrentWhenActive="page">Overview</a>
    <a routerLink="/dashboard" routerLinkActive="active" ariaCurrentWhenActive="page">Dashboard</a>
    <a routerLink="/calendar" routerLinkActive="active" ariaCurrentWhenActive="page">Calendar</a>
    <a routerLink="/admin-triggers" routerLinkActive="active" ariaCurrentWhenActive="page">Admin Triggers</a>
  </nav>
  <button
    type="button"
    class="btn theme-toggle"
    (click)="themeService.toggle()"
    [attr.aria-label]="themeService.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
  >
    {{ themeService.theme() === 'dark' ? '☀' : '☾' }}
  </button>
</header>
<main>
  <router-outlet />
</main>
