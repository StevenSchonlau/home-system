<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alert Popup Demo</title>

  <!-- ============ STYLE: how things look ============ -->
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f4f5f7;
      padding: 40px 16px;
      color: #222;
    }
    button {
      font-size: 15px;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 4px 4px 4px 0;
    }

    /* Two columns side by side; they stack on narrow screens like phones */
    .columns {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      max-width: 900px;
    }
    .columns h2 { margin: 0 0 12px; font-size: 20px; }

    /* The lists of reminders and alerts you can trigger */
    .alert-list { list-style: none; padding: 0; margin: 0; }
    .alert-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: white;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .trigger-btn { background: #333; color: white; white-space: nowrap; }

    /* The popup box. Hidden until we add the "show" class. */
    .alert-popup {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 360px;
      max-width: calc(100% - 32px);
      background: white;
      border-left: 6px solid #e5484d;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      padding: 16px;
      display: none;
    }
    .alert-popup.show { display: block; }
    .alert-popup h3 { margin: 0 0 6px; }
    .alert-popup p  { margin: 0 0 12px; line-height: 1.4; }

    /* Alert Girl picture, shown above the title for alerts that use her */
    .mascot { display: none; text-align: center; margin-bottom: 8px; }
    .mascot.show { display: block; }
    .mascot svg { width: 110px; height: auto; }
    #mascot-air svg { width: 220px; }  /* the wider pictures get more room */
    #mascot-water svg { width: 170px; }
    #mascot-smoke svg { width: 190px; }
    #mascot-filter svg { width: 130px; }
    #mascot-install svg { width: 140px; }

    /* Button colors */
    .primary   { background: #e5484d; color: white; }
    .secondary { background: #e8e8e8; color: #222; }

    /* The toaster message: a small dark bar at the top of the screen */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #222;
      color: white;
      padding: 12px 18px;
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.2);
      max-width: calc(100% - 32px);
      display: none;
      z-index: 10;  /* keeps the toast on top of everything else */
    }
    .toast.show { display: block; }

    /* ----- Fake photo upload window ----- */
    /* The dark see-through layer behind the window */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .overlay.show { display: flex; }
    .upload-window {
      background: white;
      border-radius: 12px;
      padding: 20px;
      width: 420px;
      max-width: 100%;
      box-shadow: 0 12px 32px rgba(0,0,0,0.25);
    }
    .upload-window h3 { margin: 0 0 8px; }
    .upload-window p  { margin: 0 0 14px; line-height: 1.4; }
    .fake-folder {
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 14px;
    }
    .folder-name {
      background: #f0f0f0;
      padding: 8px 12px;
      border-radius: 8px 8px 0 0;
      font-weight: 600;
    }
    .fake-file {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      cursor: pointer;
    }
    .fake-file:hover    { background: #f6f6f6; }
    .fake-file.selected { background: #dbe9ff; }
    .file-icon {
      width: 32px;
      height: 32px;
      border-radius: 4px;
      background: linear-gradient(135deg, #8ec5fc, #e0c3fc);
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>

    <h3 id="alertTitle"></h3>
    <p id="alertMessage"></p>
    <div id="alertButtons"></div>
  </div>

  <!-- The toaster message (starts hidden) -->
  <div class="toast" id="toast"></div>

  <!-- The fake photo upload window (starts hidden).
       This is pretend: no real files are read from your computer. -->
  <div class="overlay" id="uploadOverlay">
    <div class="upload-window">
      <h3>Upload a photo</h3>
      <p id="uploadPrompt"></p>

      <div class="fake-folder">
        <div class="folder-name">📁 Pictures</div>
        <div class="fake-file" id="demoFile" onclick="selectDemoPhoto()">
          <div class="file-icon"></div>
          <span>demo photo.jpg</span>
        </div>
      </div>

      <button class="primary" id="uploadBtn" onclick="uploadPhoto()" disabled>Upload</button>
      <button class="secondary" onclick="cancelUpload()">Cancel</button>
    </div>
  </div>

  <!-- ============ SCRIPT: what things do ============ -->
  <script>
    // ---------- THE LIST OF ALERTS ----------
    // To add a new alert, copy one of these blocks and change the words.
    // Each alert has:
    //   type      - "reminder" (left column) or "alert" (right column)
    //   name      - what shows in the list, and in the snooze message
    //   title, message, and a list of buttons.
    // Each button has a label, a style ("primary" = red, "secondary" = gray),
    // and an action (what happens when it's clicked).
    const alerts = [
      {
        type: "reminder",
        name: "Replace Fire Extinguisher",
        title: "Reminder",
        message: "Fire Extinguisher in the garage needs to be replaced.",
        mascot: "extinguisher",   // show this Alert Girl picture in the popup
        // Messages used by the "Mark as replaced" and "Order Replacement" buttons
        uploadPrompt: "Please upload a photo of the new extinguisher with the receipt clearly visible.",
        replacedMessage: "Extinguisher marked as replaced.",
        orderMessage: "A replacement extinguisher matching the same specifications has been ordered and will be shipped to you.",
        buttons: [
          { label: "Mark as replaced",  style: "primary",   action: "replaced" },
          { label: "Order Replacement", style: "secondary", action: "orderReplacement" },
          { label: "Dismiss",           style: "secondary", action: "dismiss" }
        ]
      },
      {
        type: "reminder",
        name: "Replace Furnace Filter",
        title: "Reminder",
        message: "It is time to replace your furnace filters. " +
                 "This keeps your air quality high and helps to prevent fires.",
        mascot: "filter",   // show this Alert Girl picture in the popup
        uploadPrompt: "Please upload a photo of the new furnace filter with the receipt clearly visible.",
        replacedMessage: "Furnace filter marked as replaced.",
        orderMessage: "Replacement furnace filters matching the same specifications have been ordered and will be shipped to you.",
        buttons: [
          { label: "Mark as replaced",  style: "primary",   action: "replaced" },
          { label: "Order Replacement", style: "secondary", action: "orderReplacement" },
          { label: "Call for Service",  style: "secondary", action: "callService" },
          { label: "Dismiss",           style: "secondary", action: "dismiss" }
        ]
      },
      {
        type: "reminder",
        name: "Replace Smoke Alarm",
        title: "Reminder",
        message: "Your smoke alarm is due to be replaced. " +
                 "Smoke alarms should be replaced every 10 years so they work when you need them.",
        mascot: "install",   // show this Alert Girl picture in the popup
        uploadPrompt: "Please upload a photo of the new smoke alarm with the receipt clearly visible.",
        replacedMessage: "Smoke alarm marked as replaced.",
        orderMessage: "A replacement smoke alarm matching the same specifications has been ordered and will be shipped to you.",
        buttons: [
          { label: "Mark as replaced",  style: "primary",   action: "replaced" },
          { label: "Order Replacement", style: "secondary", action: "orderReplacement" },
          { label: "Dismiss",           style: "secondary", action: "dismiss" }
        ]
      },
      {
        type: "alert",
        name: "Smoke alarm",
        mascot: "smoke",   // show this Alert Girl picture in the popup
        title: "ALERT",
        message: "Smoke Alarm triggered, possible fire.",
        buttons: [
          { label: "Snooze alarm for 15 minutes", style: "primary",   action: "snooze" },
          { label: "Dismiss",                     style: "secondary", action: "dismiss" }
        ]
      },
      {
        type: "alert",
        name: "Water level",
        mascot: "water",   // show this Alert Girl picture in the popup
        title: "Water Level High in Crock",
        message: "The water level in your crock is high indicating the potential for flooding. " +
                 "Please check your sump-pump is working properly. " +
                 "You may want to move items which are vulnerable to water damage away from the crock.",
        buttons: [
          { label: "Call Plumber",          style: "primary",   action: "callPlumber" },
          { label: "Dismiss",               style: "secondary", action: "dismiss" },
          { label: "Snooze for 15 minutes", style: "secondary", action: "snooze" }
        ]
      },
      {
        type: "alert",
        name: "Air quality",
        title: "Air Quality Low",
        mascot: "air",   // show this Alert Girl picture in the popup
        message: "Air quality is poor AQI over 100. " +
                 "Your air purifiers are not currently able to keep your air at ideal levels. " +
                 "You may wish to check to ensure the filters do not need to be changed.",
        buttons: [
          { label: "Dismiss",               style: "secondary", action: "dismiss" },
          { label: "Snooze for 15 minutes", style: "secondary", action: "snooze" },
          { label: "Maximize Air Quality",  style: "primary",   action: "maximizeAir" }
        ]
      }
    ];

    // ---------- BUILD THE LIST ON THE PAGE ----------
    // For each alert above, add a row with its name and a "Trigger" button,
    // in the Reminders column or the Alerts column depending on its type.
    alerts.forEach(function (alertInfo) {
      const listId = alertInfo.type === "reminder" ? "reminderList" : "alertList";
      const list = document.getElementById(listId);
      const row = document.createElement("li");

      const label = document.createElement("span");
      label.textContent = alertInfo.name;

      const button = document.createElement("button");
      button.className = "trigger-btn";
      button.textContent = "Trigger";
      button.onclick = function () { showAlert(alertInfo); };

      row.appendChild(label);
      row.appendChild(button);
      list.appendChild(row);
    });

    // ---------- SHOW AND HIDE THE POPUP ----------
    function showAlert(alertInfo) {
      document.getElementById("alertTitle").textContent = alertInfo.title;

      // Hide all Alert Girl pictures, then show the one this alert asks for (if any)
      document.querySelectorAll(".mascot").forEach(function (m) {
        m.classList.remove("show");
      });
      if (alertInfo.mascot) {
        document.getElementById("mascot-" + alertInfo.mascot).classList.add("show");
      }
      document.getElementById("alertMessage").textContent = alertInfo.message;

      // Remove any old buttons, then add this alert's buttons.
      const buttonArea = document.getElementById("alertButtons");
      buttonArea.innerHTML = "";
      alertInfo.buttons.forEach(function (b) {
        const button = document.createElement("button");
        button.className = b.style;
        button.textContent = b.label;
        button.onclick = function () { handleAction(b.action, alertInfo); };
        buttonArea.appendChild(button);
      });

      document.getElementById("alertPopup").classList.add("show");
    }

    function hideAlert() {
      document.getElementById("alertPopup").classList.remove("show");
    }

    // ---------- TOASTER MESSAGE ----------
    // Shows a small message at the top of the screen for a number of seconds.
    let toastTimer;
    function showToast(text, seconds) {
      const toast = document.getElementById("toast");
      toast.textContent = text;
      toast.classList.add("show");
      clearTimeout(toastTimer);  // if a toast is already showing, restart its timer
      toastTimer = setTimeout(function () {
        toast.classList.remove("show");
      }, seconds * 1000);
    }

    // ---------- WHAT EACH BUTTON DOES ----------
    const SNOOZE_MINUTES = 15;

    function handleAction(action, alertInfo) {
      hideAlert();  // every button closes the popup first

      if (action === "callPlumber") {
        showToast("Contacting a local plumber now. Updates will be sent to your phone.", 10);
      }
      else if (action === "snooze") {
        // e.g. "Smoke alarm alerts paused for 15 minutes"
        showToast(alertInfo.name + " alerts paused for " + SNOOZE_MINUTES + " minutes", 5);
        // Show the same alert again after the snooze time.
        // minutes x 60 seconds x 1000 milliseconds
        setTimeout(function () { showAlert(alertInfo); }, SNOOZE_MINUTES * 60 * 1000);
      }
      else if (action === "maximizeAir") {
        showToast("All system fans set to maximum and air quality alerts paused for 1 hour.", 10);
        // Show the alert again after 1 hour (60 minutes x 60 seconds x 1000 milliseconds).
        setTimeout(function () { showAlert(alertInfo); }, 60 * 60 * 1000);
      }
      else if (action === "replaced") {
        openUpload(alertInfo);
      }
      else if (action === "orderReplacement") {
        showToast(alertInfo.orderMessage, 10);
      }
      else if (action === "callService") {
        showToast("Contacting a local service technician now. Updates will be sent to your phone.", 10);
      }
      // "dismiss" needs nothing extra: the popup is already closed.
    }

    // ---------- FAKE PHOTO UPLOAD ----------
    // For the demo, this pretends to be a file picker with one file in it.
    let uploadFor = null;  // remembers which reminder opened the upload window

    function openUpload(alertInfo) {
      uploadFor = alertInfo;
      document.getElementById("uploadPrompt").textContent = alertInfo.uploadPrompt;
      document.getElementById("demoFile").classList.remove("selected");
      document.getElementById("uploadBtn").disabled = true;
      document.getElementById("uploadOverlay").classList.add("show");
    }

    // Clicking the file highlights it and turns on the Upload button.
    function selectDemoPhoto() {
      document.getElementById("demoFile").classList.add("selected");
      document.getElementById("uploadBtn").disabled = false;
    }

    function uploadPhoto() {
      document.getElementById("uploadOverlay").classList.remove("show");
      showToast(uploadFor.replacedMessage, 5);
    }

    // Cancel closes the window and brings the reminder back,
    // since the extinguisher hasn't been marked as replaced yet.
    function cancelUpload() {
      document.getElementById("uploadOverlay").classList.remove("show");
      showAlert(uploadFor);
    }
  </script>

</body>
</html>
